<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#153648"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9Z" fill="#66e3bf"/></marker>
    <style>
      .title{font:700 30px 'Microsoft YaHei',Arial,sans-serif;fill:#f0f7fb}.label{font:500 18px 'Microsoft YaHei',Arial,sans-serif;fill:#c7d9e4}.small{font:500 15px 'Microsoft YaHei',Arial,sans-serif;fill:#8fa7b6}.mono{font:500 16px Consolas,monospace;fill:#69e3c1}.chip{fill:#0d2938;stroke:#2c6873;stroke-width:1}.line{stroke:#5ee0bd;stroke-width:3;fill:none}.dash{stroke:#6ee6c2;stroke-width:2;stroke-dasharray:9 8;fill:none}.muted{stroke:#618092;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="58" y="66" class="title">动力站管道模型 · 旋转中心示意</text>
  <text x="58" y="98" class="small">鼠标拖动时旋转的是相机，不改变 b3dm 模型的自身矩阵</text>
  <line x1="58" y1="124" x2="1142" y2="124" stroke="#2c4c5d"/>

  <g transform="translate(105,170)">
    <rect x="0" y="0" width="700" height="450" rx="16" fill="#091d2b" stroke="#315467"/>
    <text x="30" y="42" class="label">工程局部坐标（Z-up）</text>
    <line x1="88" y1="370" x2="220" y2="370" stroke="#e9746c" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="88" y1="370" x2="88" y2="244" stroke="#73b4f0" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="88" y1="370" x2="42" y2="412" stroke="#66e3bf" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="229" y="377" class="small">X</text><text x="78" y="236" class="small">Z</text><text x="24" y="431" class="small">Y</text>

    <ellipse cx="408" cy="250" rx="210" ry="122" class="dash" opacity=".8"/>
    <path d="M585 169 A210 122 0 0 1 624 245" class="line" marker-end="url(#arrow)"/>
    <text x="511" y="142" class="small" fill="#69e3c1">相机环绕轨道</text>
    <circle cx="408" cy="250" r="11" fill="#f6bb55" filter="url(#glow)"/>
    <line x1="408" y1="250" x2="488" y2="105" class="muted"/>
    <rect x="489" y="61" width="186" height="76" rx="8" class="chip"/>
    <text x="504" y="91" class="label" font-size="16">相机旋转中心</text>
    <text x="504" y="118" class="mono" font-size="13">tileset root sphere</text>

    <g stroke="#8cddd0" stroke-width="3" fill="none" opacity=".95">
      <path d="M252 305 L300 269 L362 285 L410 238 L479 258 L550 215"/>
      <path d="M261 332 L321 298 L377 318 L430 274 L497 292 L563 245"/>
      <path d="M300 269 L321 298 M362 285 L377 318 M410 238 L430 274 M479 258 L497 292 M550 215 L563 245"/>
      <path d="M273 341 L273 303 L300 285 L300 325 L273 341 M535 286 L535 246 L565 230 L565 272 L535 286"/>
      <path d="M390 315 L390 252 M405 315 L405 252 M420 305 L420 247"/>
    </g>
    <text x="293" y="390" class="small">管道 b3dm 分块（相对位置不变）</text>
  </g>

  <g transform="translate(846,174)">
    <rect x="0" y="0" width="290" height="446" rx="16" fill="#0b2231" stroke="#315467"/>
    <text x="26" y="42" class="label">坐标关系</text>
    <rect x="24" y="67" width="242" height="89" rx="9" class="chip"/>
    <text x="40" y="97" class="small">局部包围体中心</text>
    <text x="40" y="126" class="mono" font-size="13">(6.6624, 108.2735,</text>
    <text x="40" y="147" class="mono" font-size="13"> 5.0634)</text>
    <path d="M145 173 L145 217" class="line" marker-end="url(#arrow)"/>
    <rect x="24" y="230" width="242" height="91" rx="9" class="chip"/>
    <text x="40" y="260" class="small">ENU 地理锚点</text>
    <text x="40" y="289" class="mono" font-size="13">118.795°E, 32.055°N</text>
    <text x="40" y="310" class="mono" font-size="13">elevation 15 m</text>
    <path d="M145 338 L145 372" class="line" marker-end="url(#arrow)"/>
    <rect x="24" y="385" width="242" height="39" rx="9" fill="#164759"/>
    <text x="43" y="411" class="label" font-size="15">相机围绕此世界中心观察</text>
  </g>
  <text x="106" y="674" class="small">初始视角 / 适应模型：以变换后的根包围球为目标；左键拖动仅改变相机方位。</text>
</svg>
